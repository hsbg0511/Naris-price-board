<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채널별 최저가 보드</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f6f4; --surface:#fcfcfb; --line:#e4e3de; --line2:#efeee9;
  --text:#0b0b0b; --text2:#52514e; --muted:#8a8984;
  --accent:#2a78d6; --good:#0d7a3e; --goodbg:#e6f4ec; --bad:#b42318; --badbg:#fdecea;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --line:#33332f; --line2:#262624;
    --text:#f0efec; --text2:#c3c2b7; --muted:#8f8e86;
    --accent:#3987e5; --good:#5fd08f; --goodbg:#163222; --bad:#ff8a80; --badbg:#3a1a17;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
header{padding:20px 16px 0;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--text2);font-size:13px}
nav{display:flex;gap:4px;max-width:1100px;margin:14px auto 0;padding:0 16px;overflow-x:auto}
nav button{border:0;background:none;color:var(--text2);padding:10px 14px;font:inherit;font-weight:600;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--text);border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:top;white-space:nowrap}
th{color:var(--text2);font-weight:600;font-size:13px;background:var(--surface);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:170px}
td .p{font-variant-numeric:tabular-nums;font-weight:600}
td .m{display:block;font-size:11px;color:var(--muted)}
td.low{background:var(--goodbg)}
td.low .p{color:var(--good)}
td a{color:inherit;text-decoration:none}
td a:hover .p{text-decoration:underline}
.old .p{color:var(--muted);font-weight:500}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;border:1px solid var(--line);color:var(--text2);margin-left:4px;font-weight:500}
.tag.man{border-color:var(--s2);color:var(--text)}
.diff-up{color:var(--bad)} .diff-dn{color:var(--good)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--text2);font-weight:600}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
textarea{min-height:40px}
.btn{border:0;background:var(--accent);color:#fff;padding:10px 16px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--text2);border:1px solid var(--line);padding:4px 10px;font-size:12px;font-weight:600}
.msg{margin-top:10px;font-size:14px}
.msg.ok{color:var(--good)} .msg.err{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--text2);margin:8px 0}
.legend span::before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:middle}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;min-width:150px}
.tip b{display:block;margin-bottom:4px}
.tip i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tip div{display:flex;justify-content:space-between;gap:12px}
.note{white-space:pre-wrap;font-size:13px;color:var(--text2)}
.empty{color:var(--muted);padding:20px 0;text-align:center}
.hide{display:none}
@media (max-width:600px){th,td{padding:8px 6px}}
</style>
</head>
<body>
<header>
  <h1>채널별 최저가 보드</h1>
  <div class="sub" id="sub">불러오는 중…</div>
</header>
<nav id="tabs">
  <button data-t="now" class="on">최저가 현황</button>
  <button data-t="input">수기 입력</button>
  <button data-t="flow">가격 흐름</button>
  <button data-t="log">입력 기록</button>
</nav>
<main>
  <section id="t-now">
    <div class="card">
      <div class="row">
        <label style="flex-direction:row;align-items:center;gap:8px">기준
          <select id="windowSel">
            <option value="1">오늘만</option>
            <option value="3">최근 3일</option>
            <option value="7" selected>최근 7일</option>
            <option value="30">최근 30일</option>
          </select>
        </label>
        <span class="sub">칸마다 기간 안의 가장 최근 값. 초록 칸 = 품목별 최저가. <span class="tag man">수기</span> = 팀원 입력.</span>
      </div>
      <div class="tbl-wrap"><table id="nowTbl"></table></div>
    </div>
    <div class="card"><b>최근 자동 조회 메모</b><div class="note" id="runNote"></div></div>
  </section>

  <section id="t-input" class="hide">
    <div class="card">
      <form id="f">
        <label>입력자 이름<input name="reporter" required maxlength="40" placeholder="예: 김민수"></label>
        <label>팀 코드<input name="code" required inputmode="numeric" autocomplete="off" placeholder="관리자에게 받은 코드"></label>
        <label>날짜<input name="date" type="date" required></label>
        <label>품목<select name="product" required></select></label>
        <label>채널<select name="channel" required></select></label>
        <label>판매가(원)<input name="price" required inputmode="numeric" placeholder="예: 36900"></label>
        <label>판매자/스토어<input name="seller" maxlength="80"></label>
        <label>상품 링크<input name="url" type="url" placeholder="https://"></label>
        <label style="grid-column:1/-1">메모 (배송비 별도, 쿠폰가 등)<textarea name="memo" maxlength="300"></textarea></label>
        <div><button class="btn" type="submit">저장</button></div>
      </form>
      <div class="msg" id="fmsg"></div>
    </div>
  </section>

  <section id="t-flow" class="hide">
    <div class="card">
      <div class="row">
        <label style="flex-direction:row;align-items:center;gap:8px">품목 <select id="flowProd"></select></label>
        <label style="flex-direction:row;align-items:center;gap:8px">기간
          <select id="flowDays"><option value="14">2주</option><option value="30" selected>30일</option><option value="90">90일</option></select>
        </label>
      </div>
      <div class="legend" id="legend"></div>
      <div class="chart" id="chart"><div class="tip" id="tip"></div></div>
      <div class="sub" id="flowSub"></div>
    </div>
  </section>

  <section id="t-log" class="hide">
    <div class="card">
      <div class="row">
        <select id="logSrc"><option value="">전체</option><option value="manual">수기만</option><option value="auto">자동만</option></select>
        <select id="logWho"><option value="">입력자 전체</option></select>
      </div>
      <div class="tbl-wrap"><table id="logTbl"></table></div>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL = "https://vkjuooikhajnydgzwvaf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZranVvb2lraGFqbnlkZ3p3dmFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3OTY2NTcsImV4cCI6MjEwOTM3MjY1N30.P4SICKIKv1GWq6-_MdIR6zqkcY8s9oCKeTjWlp8v0y4";

const H = {apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY};
const $ = s => document.querySelector(s);
const won = n => n == null ? "" : n.toLocaleString("ko-KR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kstToday = () => new Date(Date.now() + 9*3600e3).toISOString().slice(0,10);
const addDays = (d, n) => { const t = new Date(d + "T00:00:00Z"); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); };
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };

let P = [], C = [], E = [], R = [];

async function api(path){
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + path, {headers: H});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function rpc(fn, body){
  const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {method:"POST", headers:{...H, "Content-Type":"application/json"}, body: JSON.stringify(body)});
  const t = await r.text();
  if(!r.ok){ let m = t; try{ m = JSON.parse(t).message || t }catch(e){} throw new Error(m); }
  return t ? JSON.parse(t) : null;
}

async function load(){
  const since = addDays(kstToday(), -120);
  [P, C, E, R] = await Promise.all([
    api("price_products?select=*&active=eq.true&order=sort"),
    api("price_channels?select=*&order=sort"),
    api("price_entries?select=*&date=gte." + since + "&order=date.desc,created_at.desc&limit=5000"),
    api("price_runs?select=*&order=date.desc&limit=1"),
  ]);
  const last = R[0];
  $("#sub").textContent = "마지막 자동 조회: " + (last ? new Date(last.checked_at).toLocaleString("ko-KR",{timeZone:"Asia/Seoul"}) : "없음") + " · 수기 입력 " + E.filter(e=>e.source==="manual").length + "건";
  $("#runNote").textContent = last ? last.note : "";
  fillSelects(); renderNow(); renderFlow(); renderLog();
}

const pName = id => (P.find(p=>p.id===id)||{}).name || id;
const cName = id => (C.find(c=>c.id===id)||{}).name || id;
const cColor = id => { const i = C.findIndex(c=>c.id===id); return "var(--s" + ((i<0?0:i)%8+1) + ")"; };

function fillSelects(){
  const po = P.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  const co = C.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
  const f = $("#f");
  f.product.innerHTML = po; f.channel.innerHTML = co;
  const keep = $("#flowProd").value; $("#flowProd").innerHTML = po; if(keep) $("#flowProd").value = keep;
  const who = [...new Set(E.filter(e=>e.reporter).map(e=>e.reporter))];
  const kw = $("#logWho").value;
  $("#logWho").innerHTML = `<option value="">입력자 전체</option>` + who.map(w=>`<option>${esc(w)}</option>`).join("");
  $("#logWho").value = kw;
}

function renderNow(){
  const days = +$("#windowSel").value, today = kstToday(), from = addDays(today, -(days-1));
  let h = `<thead><tr><th>품목</th>${C.map(c=>`<th>${esc(c.name)}</th>`).join("")}<th>최저가</th><th>내 판매가</th></tr></thead><tbody>`;
  for(const p of P){
    const cells = C.map(c => E.find(e => e.product_id===p.id && e.channel_id===c.id && e.date>=from));
    const prices = cells.filter(Boolean).map(e=>e.price);
    const min = prices.length ? Math.min(...prices) : null;
    h += `<tr><td>${esc(p.name)}</td>`;
    cells.forEach(e => {
      if(!e){ h += `<td><span class="m">–</span></td>`; return; }
      const age = Math.round((new Date(today) - new Date(e.date))/864e5);
      const meta = [e.date.slice(5).replace("-","/"), e.seller].filter(Boolean).join(" · ");
      const inner = `<span class="p">${won(e.price)}</span>${e.source==="manual"?'<span class="tag man">수기</span>':''}<span class="m">${esc(meta)}${e.reporter?" · "+esc(e.reporter):""}</span>`;
      const link = /^https?:\/\//.test(e.url||"") ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${inner}</a>` : inner;
      h += `<td class="${e.price===min?"low":""} ${age>=2?"old":""}" title="${esc(e.title||e.memo||"")}">${link}</td>`;
    });
    let diff = "";
    if(min!=null && p.my_price){ const d = p.my_price - min; diff = d>0 ? `<span class="m diff-up">최저가보다 +${won(d)}</span>` : d<0 ? `<span class="m diff-dn">최저가보다 ${won(d)}</span>` : `<span class="m">최저가와 같음</span>`; }
    h += `<td><span class="p">${min!=null?won(min):"–"}</span></td><td><span class="p">${p.my_price?won(p.my_price):"–"}</span>${diff}</td></tr>`;
  }
  $("#nowTbl").innerHTML = h + "</tbody>";
}

function renderFlow(){
  const pid = $("#flowProd").value || (P[0]&&P[0].id); if(!pid) return;
  const days = +$("#flowDays").value, today = kstToday(), from = addDays(today, -(days-1));
  const dates = []; for(let i=0;i<days;i++) dates.push(addDays(from,i));
  const series = C.map(c => {
    const pts = dates.map(d => { const xs = E.filter(e=>e.product_id===pid && e.channel_id===c.id && e.date===d); return xs.length ? Math.min(...xs.map(e=>e.price)) : null; });
    return {id:c.id, name:c.name, color:cColor(c.id), pts};
  }).filter(s => s.pts.some(v=>v!=null));
  const p = P.find(x=>x.id===pid);
  $("#legend").innerHTML = series.map(s=>`<span style="--c:${s.color}">${esc(s.name)}</span>`).join("") + (p&&p.my_price?`<span style="--c:var(--muted)">내 판매가</span>`:"");
  const box = $("#chart"); box.querySelectorAll("svg").forEach(n=>n.remove());
  if(!series.length){ $("#flowSub").textContent = "이 기간에 기록이 없습니다."; return; }
  $("#flowSub").textContent = "날짜별 채널 최저가(자동+수기). 비어 있는 날은 건너뛰고 선으로 이어 표시합니다.";
  const W = 900, Ht = 320, m = {l:64, r:16, t:12, b:30};
  let all = series.flatMap(s=>s.pts.filter(v=>v!=null)); if(p&&p.my_price) all.push(p.my_price);
  let lo = Math.min(...all), hi = Math.max(...all); const pad = Math.max((hi-lo)*0.12, hi*0.03); lo -= pad; hi += pad;
  const x = i => m.l + (W-m.l-m.r) * (dates.length===1 ? .5 : i/(dates.length-1));
  const y = v => m.t + (Ht-m.t-m.b) * (1 - (v-lo)/(hi-lo));
  let svg = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="가격 흐름">`;
  for(let k=0;k<=4;k++){ const v = lo + (hi-lo)*k/4; svg += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${won(Math.round(v/10)*10)}</text>`; }
  const step = Math.ceil(dates.length/8);
  dates.forEach((d,i)=>{ if((i%step===0 && dates.length-1-i >= step/2) || i===dates.length-1) svg += `<text x="${x(i)}" y="${Ht-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${d.slice(5).replace("-","/")}</text>`; });
  if(p&&p.my_price) svg += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(p.my_price)}" y2="${y(p.my_price)}" stroke="var(--muted)" stroke-dasharray="5 5" stroke-width="1.5"/>`;
  series.forEach(s=>{
    const pts = s.pts.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
    svg += `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" points="${pts.map(q=>q.join(",")).join(" ")}"/>`;
    pts.forEach(q=> svg += `<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`);
  });
  svg += `<line id="xh" y1="${m.t}" y2="${Ht-m.b}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/><rect x="${m.l}" y="0" width="${W-m.l-m.r}" height="${Ht}" fill="transparent" id="hit"/></svg>`;
  box.insertAdjacentHTML("afterbegin", svg);
  const el = box.querySelector("svg"), tip = $("#tip"), xh = el.querySelector("#xh");
  const move = ev => {
    const r = el.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(dates.length-1, Math.round((sx-m.l)/((W-m.l-m.r)/Math.max(1,dates.length-1)))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility","visible");
    const rows = series.map(s=>({s, v:s.pts[i]})).filter(o=>o.v!=null).sort((a,b)=>a.v-b.v);
    tip.innerHTML = `<b>${dates[i]}</b>` + (rows.length ? rows.map(o=>`<div><span><i style="background:${o.s.color}"></i>${esc(o.s.name)}</span><span>${won(o.v)}</span></div>`).join("") : `<div>기록 없음</div>`) + (p&&p.my_price?`<div><span>내 판매가</span><span>${won(p.my_price)}</span></div>`:"");
    tip.style.display = "block";
    const px = x(i) * r.width / W, left = px + 170 > r.width ? px - 170 : px + 12;
    tip.style.left = left + "px"; tip.style.top = "10px";
  };
  el.addEventListener("pointermove", move);
  el.addEventListener("pointerleave", ()=>{ tip.style.display="none"; xh.setAttribute("visibility","hidden"); });
}

function renderLog(){
  const src = $("#logSrc").value, who = $("#logWho").value;
  const rows = E.filter(e => (!src || e.source===src) && (!who || e.reporter===who)).slice(0, 200);
  if(!rows.length){ $("#logTbl").innerHTML = `<tr><td class="empty">기록이 없습니다.</td></tr>`; return; }
  $("#logTbl").innerHTML = `<thead><tr><th>품목</th><th>날짜</th><th>채널</th><th>가격</th><th>판매자</th><th>구분</th><th>메모</th><th></th></tr></thead><tbody>` +
    rows.map(e=>`<tr><td>${esc(pName(e.product_id))}</td><td>${e.date}</td><td>${esc(cName(e.channel_id))}</td><td>${/^https?:\/\//.test(e.url||"")?`<a href="${esc(e.url)}" target="_blank" rel="noopener"><span class="p">${won(e.price)}</span></a>`:`<span class="p">${won(e.price)}</span>`}</td><td>${esc(e.seller||"")}</td><td>${e.source==="manual"?`<span class="tag man">수기</span> ${esc(e.reporter||"")}`:'<span class="tag">자동</span>'}</td><td style="white-space:normal;text-align:left;max-width:260px">${esc(e.memo||"")}</td><td><button class="btn ghost" data-del="${e.id}">삭제</button></td></tr>`).join("") + "</tbody>";
}

document.addEventListener("click", async ev => {
  const t = ev.target;
  if(t.dataset.t){
    document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b===t));
    ["now","input","flow","log"].forEach(k=>$("#t-"+k).classList.toggle("hide", k!==t.dataset.t));
    store.set("tab", t.dataset.t);
    if(t.dataset.t==="flow") renderFlow();
  }
  if(t.dataset.del){
    const code = prompt("관리자 코드를 입력하면 이 기록을 삭제합니다.");
    if(!code) return;
    try{ await rpc("price_delete", {p_code: code, p_id: +t.dataset.del}); await load(); }
    catch(e){ alert("삭제 실패: " + e.message); }
  }
});
["#windowSel"].forEach(s=>$(s).addEventListener("change", renderNow));
["#flowProd","#flowDays"].forEach(s=>$(s).addEventListener("change", renderFlow));
["#logSrc","#logWho"].forEach(s=>$(s).addEventListener("change", renderLog));

$("#f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = ev.target, msg = $("#fmsg");
  const price = parseInt(String(f.price.value).replace(/[^0-9]/g,""), 10);
  msg.className = "msg"; msg.textContent = "저장 중…";
  try{
    await rpc("price_submit", {p_code:f.code.value.trim(), p_date:f.date.value, p_product:f.product.value, p_channel:f.channel.value,
      p_price:price, p_reporter:f.reporter.value.trim(), p_seller:f.seller.value, p_url:f.url.value, p_memo:f.memo.value});
    store.set("reporter", f.reporter.value.trim()); store.set("code", f.code.value.trim());
    msg.className = "msg ok"; msg.textContent = `저장했습니다: ${pName(f.product.value)} · ${cName(f.channel.value)} · ${won(price)}원`;
    f.price.value = ""; f.seller.value = ""; f.url.value = ""; f.memo.value = "";
    await load();
  }catch(e){ msg.className = "msg err"; msg.textContent = "저장 실패: " + e.message; }
});

(function init(){
  const f = $("#f");
  f.date.value = kstToday();
  f.reporter.value = store.get("reporter") || "";
  f.code.value = store.get("code") || "";
  const tab = store.get("tab"); if(tab){ const b = document.querySelector(`nav button[data-t="${tab}"]`); if(b) b.click(); }
  load().catch(e => { $("#sub").textContent = "데이터를 불러오지 못했습니다: " + e.message; });
})();
</script>
